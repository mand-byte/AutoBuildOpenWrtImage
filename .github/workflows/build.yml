name: Build OpenWrt for x86-64

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动触发
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本号 (例如 25.12.3)'
        required: true
        default: '25.12.3'
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || '25.12.3' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"

    - name: Update and install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath java-wrappers jq libelf-dev libffi-dev \
          libncurses5-dev libncursesw5-dev libssl-dev python3 python3-pyelftools \
          python3-setuptools unzip wget python3-dev zlib1g-dev bison flex \
          subversion quilt xsltproc gperf gengetopt liberror-perl \
          libgmp3-dev libmpc-dev libmpfr-dev texinfo patch curl \
          autoconf automake libtool pkg-config rsync kmod

    - name: Checkout OpenWrt source
      run: |
        git clone https://github.com/openwrt/openwrt.git
        cd openwrt
        git checkout "v${OPENWRT_VERSION}"

    - name: Replace feeds.conf.default with GitHub mirrors (dynamic branch)
      run: |
        cd openwrt
        
        # 计算 feeds 分支名，例如 24.10.5 → openwrt-24.10
        MAJOR_MINOR=$(echo "${OPENWRT_VERSION}" | cut -d. -f1-2)
        FEEDS_BRANCH="openwrt-${MAJOR_MINOR}"
        
        echo "Using OpenWrt version: ${OPENWRT_VERSION}"
        echo "Feeds branch: ${FEEDS_BRANCH}"
        
        # 备份原文件
        cp feeds.conf.default feeds.conf.default.bak
        
        # 动态替换 4 个官方 feeds 为 GitHub 镜像 + 分支
        sed -i "s|https://git.openwrt.org/feed/packages.git.*|https://github.com/openwrt/packages.git;${FEEDS_BRANCH}|" feeds.conf.default
        sed -i "s|https://git.openwrt.org/project/luci.git.*|https://github.com/openwrt/luci.git;${FEEDS_BRANCH}|" feeds.conf.default
        sed -i "s|https://git.openwrt.org/feed/routing.git.*|https://github.com/openwrt/routing.git;${FEEDS_BRANCH}|" feeds.conf.default
        sed -i "s|https://git.openwrt.org/feed/telephony.git.*|https://github.com/openwrt/telephony.git;${FEEDS_BRANCH}|" feeds.conf.default
        grep -q '^src-git homeproxy ' feeds.conf.default || echo "src-git homeproxy https://github.com/immortalwrt/homeproxy.git;master" >> feeds.conf.default

        # 输出查看结果
        echo "Updated feeds.conf.default:"
        cat feeds.conf.default

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a
        ./scripts/feeds install -f -p packages sing-box
        test -f feeds/homeproxy/Makefile

        if ! find -L package -maxdepth 6 -path '*homeproxy*Makefile' -exec grep -q '^PKG_NAME:=luci-app-homeproxy' {} \; -print | grep -q .; then
          mkdir -p package/feeds/homeproxy
          ln -sfn ../../../feeds/homeproxy package/feeds/homeproxy/luci-app-homeproxy
        fi

        echo "HomeProxy package Makefile:"
        find -L package -maxdepth 6 -path '*homeproxy*Makefile' -print

    - name: Add HomeProxy to x86-64 image packages
      run: |
        if ! grep -q 'luci-app-homeproxy' target/linux/x86/image/64.mk; then
          sed -i '/^  GRUB2_VARIANT := generic$/i\  DEVICE_PACKAGES += luci-app-homeproxy sing-box firewall4' target/linux/x86/image/64.mk
        fi

        echo "x86-64 generic image package block:"
        sed -n '/define Device\/generic/,/endef/p' target/linux/x86/image/64.mk
      working-directory: openwrt
        
    - name: Copy custom .config
      run: |
        cp ../.config .config
      working-directory: openwrt
      
    - name: Add TurboACC without Shortcut-FE patch
      run: |
        curl -sSL https://raw.githubusercontent.com/mufeng05/turboacc/main/add_turboacc.sh -o add_turboacc.sh
        chmod +x add_turboacc.sh
        ./add_turboacc.sh
        find target/linux/generic -path '*/953-net-patch-linux-kernel-to-support-shortcut-fe.patch' -delete
        grep -q '^PKG_FIXUP:=autoreconf' package/libs/libnftnl/Makefile || sed -i '/^PKG_MAINTAINER:=/a PKG_FIXUP:=autoreconf' package/libs/libnftnl/Makefile
      working-directory: openwrt

    - name: Reapply required package selections
      run: |
        set_config_y() {
          local symbol="$1"
          sed -i "/^${symbol}=/d;/^# ${symbol} is not set$/d" .config
          echo "${symbol}=y" >> .config
        }

        set_config_y CONFIG_PACKAGE_firewall4
        set_config_y CONFIG_PACKAGE_kmod-inet-diag
        set_config_y CONFIG_PACKAGE_kmod-nft-tproxy
        set_config_y CONFIG_PACKAGE_kmod-tun
        set_config_y CONFIG_PACKAGE_sing-box
        set_config_y CONFIG_PACKAGE_ucode-mod-digest
        set_config_y CONFIG_PACKAGE_luci-app-homeproxy
        set_config_y CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn
      working-directory: openwrt
      
    - name: make defconfig
      run: |
        make defconfig
      working-directory: openwrt

    - name: Verify HomeProxy selection
      run: |
        missing=0
        for symbol in \
          CONFIG_PACKAGE_luci-app-homeproxy \
          CONFIG_PACKAGE_sing-box \
          CONFIG_PACKAGE_firewall4
        do
          if grep -qx "${symbol}=y" .config; then
            echo "${symbol}=y"
          else
            echo "::error::${symbol}=y is missing after make defconfig"
            missing=1
          fi
        done

        if [ "${missing}" -ne 0 ]; then
          echo "::group::Related .config entries"
          grep -nE 'CONFIG_PACKAGE_(luci-app-homeproxy|luci-i18n-homeproxy|sing-box|firewall4|kmod-inet-diag|kmod-nft-tproxy|kmod-tun|ucode-mod-digest)' .config || true
          echo "::endgroup::"

          echo "::group::HomeProxy and sing-box package files"
          find -L package feeds -maxdepth 6 \( -iname '*homeproxy*' -o -iname 'sing-box' \) -print -exec ls -ld {} \; || true
          echo "::endgroup::"

          echo "::group::HomeProxy dependencies"
          find -L feeds/homeproxy package -maxdepth 7 -path '*homeproxy*Makefile' -print -exec sed -n '1,80p' {} \; || true
          echo "::endgroup::"

          exit 1
        fi
      working-directory: openwrt

    - name: Download dependencies
      run: |
        cd openwrt
        make download -j$(nproc)

    - name: Build OpenWrt
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Verify HomeProxy firmware package
      run: |
        homeproxy_ok=0
        sing_box_ok=0

        if grep -hE '^luci-app-homeproxy[[:space:]-]' bin/targets/x86/64/*.manifest; then
          homeproxy_ok=1
        elif find build_dir \( -path '*/root-*/etc/init.d/homeproxy' -o -path '*/target-*/etc/init.d/homeproxy' \) -print -quit | grep -q .; then
          echo "luci-app-homeproxy files found in generated rootfs"
          homeproxy_ok=1
        else
          echo "::error::luci-app-homeproxy is missing from firmware manifest and generated rootfs"
        fi

        if grep -hE '^sing-box[[:space:]-]' bin/targets/x86/64/*.manifest; then
          sing_box_ok=1
        elif find build_dir \( -path '*/root-*/usr/bin/sing-box' -o -path '*/target-*/usr/bin/sing-box' \) -print -quit | grep -q .; then
          echo "sing-box binary found in generated rootfs"
          sing_box_ok=1
        else
          echo "::error::sing-box is missing from firmware manifest and generated rootfs"
        fi

        if [ "${homeproxy_ok}" -ne 1 ] || [ "${sing_box_ok}" -ne 1 ]; then
          echo "::group::Manifest package matches"
          grep -hE 'homeproxy|sing-box|firewall4|luci-base|rpcd' bin/targets/x86/64/*.manifest || true
          echo "::endgroup::"

          echo "::group::Generated HomeProxy and sing-box packages"
          find bin packages build_dir -iname '*homeproxy*' -o -iname '*sing-box*' | sort || true
          echo "::endgroup::"

          echo "::group::Final .config entries"
          grep -nE 'CONFIG_PACKAGE_(luci-app-homeproxy|luci-i18n-homeproxy|sing-box|firewall4)' .config || true
          echo "::endgroup::"

          echo "::group::Generated rootfs matches"
          find build_dir \( -path '*/root-*/etc/init.d/homeproxy' -o -path '*/target-*/etc/init.d/homeproxy' -o -path '*/root-*/usr/bin/sing-box' -o -path '*/target-*/usr/bin/sing-box' -o -path '*/root-*/etc/config/homeproxy' -o -path '*/target-*/etc/config/homeproxy' \) -print || true
          echo "::endgroup::"

          exit 1
        fi
      working-directory: openwrt

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_Firmware
        path: |
          openwrt/bin/targets/x86/64/*
          !openwrt/bin/targets/x86/64/*.buildinfo
